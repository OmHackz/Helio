name: Stale issues

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues
        uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,confirmed,good first issue
          exempt-pr-labels: pinned,security,work in progress
          stale-issue-message: |
            This issue has been inactive for 60 days. It will close in 14 days
            unless there is new activity. If it is still relevant, leave a
            comment with an update — logs and your `helio version` output help.
          close-issue-message: |
            Closing due to inactivity. Reopen or file a new issue if the problem
            returns, and include fresh logs.
          stale-pr-message: |
            This pull request has been inactive for 45 days. It will close in
            14 days unless there is new activity.
          close-pr-message: |
            Closing due to inactivity. Feel free to reopen when you are ready to
            continue.
