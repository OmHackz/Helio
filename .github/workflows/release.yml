name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches Helio.csproj
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Helio.csproj | head -n1)"
          tag="${GITHUB_REF_NAME#v}"
          echo "project version: $version"
          echo "git tag:         $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match <Version>$version</Version> in Helio.csproj."
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: Helio.csproj

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Helio.csproj | head -n1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish Helio.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishReadyToRun=false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o publish

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          tar -czf "../helio-${{ steps.version.outputs.value }}-${{ matrix.rid }}.tar.gz" .
          cd ..
          ls -lh helio-*.tar.gz

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "helio-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip"
          Get-ChildItem helio-*.zip | Format-Table Name, Length

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: helio-${{ matrix.rid }}
          path: |
            helio-*.tar.gz
            helio-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: helio-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
