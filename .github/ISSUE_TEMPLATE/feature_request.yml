name: Feature request
description: Suggest a new command, option, workflow, or quality-of-life improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape HelioMC. Please describe the problem first —
        the best feature requests explain *why*, not only *what*.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is frustrating or missing today?
      placeholder: "I keep forgetting which instance is selected, and..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the command, flag, or behavior you would like.
      placeholder: |
        `helio instance select` could accept...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or different designs you have tried?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Instance management
        - Mods / modpacks / content
        - Ely.by authentication
        - Launching / Java
        - UI, theme, or prompt
        - Documentation
        - Build, CI, or packaging
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
